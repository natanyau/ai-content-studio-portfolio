<!DOCTYPE html>

<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:"Manrope",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
    background:
      radial-gradient(120% 90% at 78% 10%,#26272e 0%,rgba(12,12,16,0) 55%),
      radial-gradient(120% 120% at 12% 96%,#1a1414 0%,rgba(10,10,11,0) 50%),
      #0a0a0b;
    color:#fff;-webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:100vh;text-align:center;padding:40px 24px;overflow:hidden;position:relative;
  }
  body::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background-image:repeating-linear-gradient(0deg,transparent 0 3px,rgba(0,0,0,.14) 3px 4px);opacity:.35;
  }
  .wrap{position:relative;z-index:1;max-width:560px}
  .eyebrow{font-size:.72rem;font-weight:600;letter-spacing:.28em;text-transform:uppercase;color:#8b8b90;margin-bottom:22px}

  .code span{color:#8b8b90;font-weight:300}
  h1{font-size:clamp(1.4rem,3vw,2rem);font-weight:800;letter-spacing:-.03em;margin:18px 0 14px}
  p{color:#b7b7bc;font-size:1.02rem;line-height:1.6;max-width:42ch;margin:0 auto 32px}
  .btn{
    display:inline-flex;align-items:center;gap:10px;
    font-size:.82rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
    padding:15px 28px;border-radius:999px;background:#e1262f;color:#fff;text-decoration:none;
    transition:background .3s cubic-bezier(.22,1,.36,1),transform .3s cubic-bezier(.22,1,.36,1);
  }
  .btn:hover{background:#ff4a52;transform:translateY(-2px)}
  .foot{margin-top:44px;font-size:.68rem;letter-spacing:.28em;text-transform:uppercase;color:#8b8b90}

  <div class="wrap">
